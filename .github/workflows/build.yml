name: Build APK
on:
  push:
  workflow_dispatch:
    inputs:
      post_max:
        description: "Опубликовать в MAX"
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Restore keystore
        run: |
          base64 -d keystore.b64 > app/sleepcalc.p12
          echo "83e742bb459c5f577d086cfc02539786e9ba512a5d79764855dff466aa44b2d9  app/sleepcalc.p12" | sha256sum -c -
      - run: gradle assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: SleepCalc-apk
          path: app/build/outputs/apk/release/*.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: SleepCalc ${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          make_latest: true
          files: app/build/outputs/apk/release/app-release.apk
      - name: Post to MAX
        if: ${{ contains(github.event.head_commit.message, '[max]') || inputs.post_max == true }}
        continue-on-error: true
        env:
          MAX_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
          MAX_CHAT: ${{ secrets.MAX_CHAT_ID }}
          NOTES: ${{ github.event.head_commit.message }}
          TAG: v${{ github.run_number }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$MAX_TOKEN" ] || [ -z "$MAX_CHAT" ]; then
            echo "Не заданы секреты MAX_BOT_TOKEN или MAX_CHAT_ID"
            exit 1
          fi
          curl -fsS -o root.crt https://gu-st.ru/content/lending/russian_trusted_root_ca_pem.crt
          curl -fsS -o sub.crt https://gu-st.ru/content/lending/russian_trusted_sub_ca_pem.crt
          cat root.crt sub.crt > ca.pem
          LINK="https://github.com/$REPO/releases/download/$TAG/app-release.apk"
          CLEAN=$(printf '%s' "$NOTES" | sed 's/\[max\]//g')
          TEXT=$(printf '**SleepCalc %s**\n\n%s\n\n[Скачать APK](%s)' "$TAG" "$CLEAN" "$LINK")
          jq -n --arg t "$TEXT" '{text: $t, format: "markdown"}' > body.json
          curl -sS -w '\nHTTP %{http_code}\n' --cacert ca.pem \
            -X POST "https://platform-api2.max.ru/messages?chat_id=$MAX_CHAT" \
            -H "Authorization: $MAX_TOKEN" \
            -H "Content-Type: application/json" \
            --data @body.json
